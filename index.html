            letter-spacing: 0.3em;
            color: white;
            text-shadow: 0 0 10px #ff0000, 0 0 20px #ff0000;
            animation: fadeBlink 3s ease-in-out forwards;
        }

        @keyframes fadeBlink {
            0%, 100% { opacity: 0; }
            20%, 80% { opacity: 1; }
        }

        /* Contenedor principal */
        #mainApp {
            display: none;
            padding: 20px;
            max-width: 700px;
            margin: auto;
            color: white;
        }

        h1 {
            text-align: center;
            margin-bottom: 20px;
            color: #ff0000;
            text-shadow: 0 0 5px #ff0000;
        }

        label {
            display: block;
            margin-top: 15px;
            font-weight: 700;
            color: #fff;
        }

        select, button {
            width: 100%;
            padding: 12px;
            margin-top: 5px;
            background-color: #111;
            border: 1px solid #ff0000;
            color: #fff;
            border-radius: 6px;
            font-size: 1.1rem;
            transition: background-color 0.3s ease;
        }

        select:hover, button:hover {

            cursor: pointer;

        button {

            background-color: #ff0000;

            border-radius: 8px;
            font-family: monospace;
            white-space: pre-wrap;

            ],

                'Honor 200 Pro', '100 Pro', '90', 'X9b', 'X8b',
                'Honor Play 50 Plus', 'Pad 9'
            ],

                'Nothing Phone (2a)', 'Phone (2)', 'Phone (1)'
            ],

            ],
            RedMagic: [
                'Red Magic 9 Pro+', '9 Pro', '8S Pro+', '8 Pro', '7S Pro'
            ],

                'Black Shark 5 Pro', '5 RS', '4 Pro', '3'
            ]
        };

        // Sensibilidad base calibrada por marca según pantalla y táctil
        const baseSensibility = {
            Samsung: 38,
            Xiaomi: 42,
            Apple: 36,
            OnePlus: 40,
            Huawei: 39,
            Oppo: 41,
            Realme: 38,
            Vivo: 37,
            Motorola: 36,
            Sony: 35,
            Google: 34,
            Nokia: 33,
            Asus: 37,
            Lenovo: 35,
            LG: 34,
            ZTE: 33,
            BlackBerry: 32,
            Tecno: 40,
            Infinix: 41,
            Meizu: 38,
            Honor: 39,
            Nothing: 37,
            Fairphone: 35,
            RedMagic: 42,
            BlackShark: 43
        };

        // Elementos del DOM
        const deviceBrandSelect = document.getElementById('deviceBrand');
        const deviceModelSelect = document.getElementById('deviceModel');
        const sensibilitySelect = document.getElementById('sensibility');
        const resultDiv = document.getElementById('result');
        const generateBtn = document.getElementById('generateBtn');
        const splashScreen = document.getElementById('splashScreen');
        const mainApp = document.getElementById('mainApp');

        // Rellena modelos según marca seleccionada
        deviceBrandSelect.addEventListener('change', () => {
            const brand = deviceBrandSelect.value;
            deviceModelSelect.innerHTML = '<option value="" disabled selected>Elige un modelo</option>';
            if (modelsByBrand[brand]) {
                modelsByBrand[brand].forEach(model => {
                    const option = document.createElement('option');
                    option.value = model;
                    option.textContent = model;
                    deviceModelSelect.appendChild(option);
                });
            }
        });

        // Generar sensibilidad calibrada
        function generateSensitivity(brand, model, sensibility) {
            // Ajuste por modelo: basado en tamaño y características aproximadas
            const modelAdjustment = (model.length % 5) - 2;

            // Sensibilidad base
            let sensValue = baseSensibility[brand] + modelAdjustment;

            // Ajuste por tipo de sensibilidad
            const niveles = {
                baja: { suma: -3.5, nombre: 'Baja - Precisión Corto Alcance' },
                media: { suma: 0, nombre: 'Media - Equilibrada' },
                alta: { suma: 6.5, nombre: 'Alta - Precisión Largo Alcance' },
                maxima: { suma: 12, nombre: 'MÁXIMA - Tiros a la Cabeza 100% Rojo' }
            };

            const nivel = niveles[sensibility];
            sensValue += nivel.suma;

            // Ajuste final calibrado para disparos a la cabeza
            const finalSens = (sensValue * 1.12).toFixed(2);

            return {
                marca: brand,
                modelo: model,
                tipoSensibilidad: nivel.nombre,
                valorSensibilidad: finalSens,
                descripcion: `✅ Sensibilidad calibrada para ${brand} ${model}.\n🎯 Optimizada para tiros a la cabeza.\n🔥 Configuración equilibrada para levantar mira fácilmente.\n⚡ Valor calculado con ajuste por marca + modelo + nivel.`
            };
        }

        // Botón generar
        generateBtn.addEventListener('click', () => {
            const brand = deviceBrandSelect.value;
            const model = deviceModelSelect.value;
            const sens = sensibilitySelect.value;

            if (!brand || !model || !sens) {
                alert('⚠️ Por favor, selecciona MARCA, MODELO y TIPO de sensibilidad.');
                return;
            }

            const config = generateSensitivity(brand, model, sens);

            resultDiv.textContent =
                `📱 Marca: ${config.marca}\n` +
                `🔧 Modelo: ${config.modelo}\n` +
                `🎯 Tipo: ${config.tipoSensibilidad}\n` +
                `⚡ Sensibilidad: ${config.valorSensibilidad}\n\n` +
                `${config.descripcion}`;
        });

        // Pantalla de inicio
        window.addEventListener('load', () => {
            setTimeout(() => {
                splashScreen.style.display = 'none';
                mainApp.style.display = 'block';
            }, 3000);
        });
