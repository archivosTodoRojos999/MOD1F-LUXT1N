<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Luxtin S4nc1 - Generador de Sensibilidades para Free Fire</title>
    <style>
        /* Estilos básicos */
        body, html {
            margin: 0;
            padding: 0;
            height: 100%;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #000000;
            color: #fff;
        }

        /* Pantalla de inicio */
        #splashScreen {
            background-color: #000;
            height: 100%;
            width: 100%;
            position: fixed;
            z-index: 10;
            display: flex;
            justify-content: center;
            align-items: center;
            flex-direction: column;
        }

        #logoText {
            font-size: 4rem;
            font-weight: 900;
            letter-spacing: 0.3em;
            color: white;
            text-shadow: 0 0 10px #ff0000, 0 0 20px #ff0000;
            animation: fadeBlink 3s ease-in-out forwards;
        }

        @keyframes fadeBlink {
            0%, 100% { opacity: 0; }
            20%, 80% { opacity: 1; }
        }

        /* Contenedor principal */
        #mainApp {
            display: none;
            padding: 20px;
            max-width: 700px;
            margin: auto;
            color: white;
        }

        h1 {
            text-align: center;
            margin-bottom: 20px;
            color: #ff0000;
            text-shadow: 0 0 5px #ff0000;
        }

        label {
            display: block;
            margin-top: 15px;
            font-weight: 700;
            color: #fff;
        }

        select, button {
            width: 100%;
            padding: 12px;
            margin-top: 5px;
            background-color: #111;
            border: 1px solid #ff0000;
            color: #fff;
            border-radius: 6px;
            font-size: 1.1rem;
            transition: background-color 0.3s ease;
        }

        select:hover, button:hover {
            background-color: #220000;
            cursor: pointer;
        }

        button {
            margin-top: 25px;
            background-color: #ff0000;
            font-weight: 900;
        }

        #result {
            margin-top: 30px;
            background-color: #111;
            padding: 20px;
            border-radius: 8px;
            font-family: monospace;
            white-space: pre-wrap;
            box-shadow: 0 0 15px #ff0000;
        }

        /* Scroll para la lista de modelos si es muy larga */
        #deviceModel {
            max-height: 150px;
            overflow-y: auto;
        }
    </style>
</head>
<body>
    <!-- Pantalla de inicio -->
    <div id="splashScreen">
        <div id="logoText">LUXT1N S4NC1</div>
    </div>

    <!-- Pantalla principal -->
    <div id="mainApp">
        <h1>Generador de Sensibilidades para Free Fire</h1>

        <label for="deviceBrand">Selecciona la Marca:</label>
        <select id="deviceBrand" required>
            <option value="" disabled selected>Elige una marca</option>
            <option value="Samsung">Samsung</option>
            <option value="Xiaomi">Xiaomi</option>
            <option value="Apple">Apple</option>
            <option value="OnePlus">OnePlus</option>
            <option value="Huawei">Huawei</option>
            <option value="Oppo">Oppo</option>
            <option value="Realme">Realme</option>
            <option value="Vivo">Vivo</option>
            <option value="Motorola">Motorola</option>
            <option value="Sony">Sony</option>
            <option value="Google">Google</option>
            <option value="Nokia">Nokia</option>
            <option value="Asus">Asus</option>
            <option value="Lenovo">Lenovo</option>
            <option value="LG">LG</option>
            <option value="ZTE">ZTE</option>
            <option value="BlackBerry">BlackBerry</option>
            <!-- Puedes ampliar más -->
        </select>

        <label for="deviceModel">Selecciona el Modelo:</label>
        <select id="deviceModel" required size="7">
            <option value="" disabled selected>Elige un modelo</option>
        </select>

        <label for="sensibility">Selecciona Sensibilidad:</label>
        <select id="sensibility" required>
            <option value="" disabled selected>Elige sensibilidad</option>
            <option value="baja">Baja (Precisión corto alcance)</option>
            <option value="alta">Alta (Precisión largo alcance)</option>
        </select>

        <button id="generateBtn">Generar Sensibilidad Calibrada "Tipo Hacker"</button>

        <div id="result"></div>
    </div>

    <script>
        // Lista ampliada de modelos por marca (ejemplos reales)
        const modelsByBrand = {
            Samsung: ['Galaxy S21 Ultra', 'Galaxy S21', 'Galaxy Note 20 Ultra', 'Galaxy A52', 'Galaxy S10', 'Galaxy Z Fold 3', 'Galaxy M32'],
            Xiaomi: ['Redmi Note 10 Pro', 'Mi 11 Ultra', 'Poco X3 Pro', 'Redmi 9A', 'Mi 10T', 'Redmi K40', 'Black Shark 4'],
            Apple: ['iPhone 13 Pro Max', 'iPhone 13', 'iPhone 12 Pro', 'iPhone SE (2020)', 'iPhone 11', 'iPhone XR', 'iPhone X'],
            OnePlus: ['9 Pro', '9', 'Nord 2', '8T', '7T Pro', '7', '6T'],
            Huawei: ['P40 Pro', 'Mate 40 Pro', 'Nova 7', 'Y7a', 'P30', 'Mate 30', 'Honor 50'],
            Oppo: ['Find X3 Pro', 'Reno 6', 'A54', 'F19 Pro', 'A94', 'Reno 5', 'A53'],
            Realme: ['GT Master', '8 Pro', 'Narzo 30', 'X7 Max', 'C25', '7i', '6 Pro'],
            Vivo: ['X60 Pro', 'V21', 'Y20', 'S9', 'V20 SE', 'Y12s', 'iQOO 7'],
            Motorola: ['Moto G100', 'Edge 20', 'G9 Plus', 'One Fusion+', 'Razr 5G', 'Moto E7', 'Moto Z4'],
            Sony: ['Xperia 1 III', 'Xperia 5 II', 'Xperia 10 III', 'Xperia L4', 'Xperia 1 II', 'Xperia 5', 'Xperia 10 II'],
            Google: ['Pixel 6 Pro', 'Pixel 6', 'Pixel 5a', 'Pixel 4 XL', 'Pixel 4', 'Pixel 3a', 'Pixel 3'],
            Nokia: ['8.3 5G', '5.4', '3.4', '2.4', '1.4', '7.2', '6.2'],
            Asus: ['ROG Phone 5', 'Zenfone 8', 'Zenfone 7', 'ROG Phone 3', 'Zenfone 6', 'ROG Phone 2', 'Zenfone Max Pro M2'],
            Lenovo: ['Legion Phone Duel 2', 'K12 Pro', 'Z6 Pro', 'A6 Note', 'K10 Note', 'Z5 Pro', 'Phab 2 Pro'],
            LG: ['Velvet', 'Wing', 'G8X ThinQ', 'V60 ThinQ', 'G7 ThinQ', 'V50 ThinQ', 'K92 5G'],
            ZTE: ['Axon 30 Ultra', 'Blade V2020', 'Axon 20 5G', 'Blade A7s 2020', 'Axon 11 SE', 'Blade 20 Smart', 'Nubia Red Magic 6'],
            BlackBerry: ['Key2', 'Motion', 'Evolve', 'Evolve X', 'KeyOne', 'Priv', 'DTEK60']
        };

        // Rellena modelos según marca seleccionada
        const deviceBrandSelect = document.getElementById('deviceBrand');
        const deviceModelSelect = document.getElementById('deviceModel');
        const sensibilitySelect = document.getElementById('sensibility');
        const resultDiv = document.getElementById('result');
        const generateBtn = document.getElementById('generateBtn');
        const splashScreen = document.getElementById('splashScreen');
        const mainApp = document.getElementById('mainApp');

        deviceBrandSelect.addEventListener('change', () => {
            const brand = deviceBrandSelect.value;
            deviceModelSelect.innerHTML = '<option value="" disabled selected>Elige un modelo</option>';
            if (modelsByBrand[brand]) {
                modelsByBrand[brand].forEach(model => {
                    const option = document.createElement('option');
                    option.value = model;
                    option.textContent = model;
                    deviceModelSelect.appendChild(option);
                });
            }
        });

        // Generar sensibilidad calibrada y precisa
        function generateSensitivity(brand, model, sensibility) {
            // Base sensibilidad simulada (valores para ejemplo, calibrados para precisión)
            const baseSensibility = {
                Samsung: 38,
                Xiaomi: 42,
                Apple: 36,
                OnePlus: 40,
                Huawei: 39,
                Oppo: 41,
                Realme: 38,
                Vivo: 37,
                Motorola: 36,
                Sony: 35,
                Google: 34,
                Nokia: 33,
                Asus: 37,
                Lenovo: 35,
                LG: 34,
                ZTE: 33,
                BlackBerry: 32
            };

            // Ajuste basado en modelo: un valor entre -2 y +2 según longitud del string modelo
            const modelAdjustment = (model.length % 5) - 2;

            // Sensibilidad base + ajuste modelo
            let sensValue = baseSensibility[brand] + modelAdjustment;

            // Ajuste según sensibilidad alta/baja
            if (sensibility === 'alta') {
                sensValue += 6.5;  // sensibilidad alta para precisión a distancia
            } else {
                sensValue -= 3.5;  // sensibilidad baja para precisión en corto alcance
            }

            // Ajuste final IA simulada para que todos los disparos sean a la cabeza (todo rojo)
            const finalSens = (sensValue * 1.12).toFixed(2);

            return {
                marca: brand,
                modelo: model,
                tipoSensibilidad: sensibility === 'alta'
                    ? 'Alta - Precisión Largo Alcance'
                    : 'Baja - Precisión Corto Alcance',
                valorSensibilidad: finalSens,
                descripcion: `Sensibilidad calibrada única y precisa para ${brand} ${model}. Optimizada para tiros 100% cabeza (todo rojo).`
            };
        }

        generateBtn.addEventListener('click', () => {
            const brand = deviceBrandSelect.value;
            const model = deviceModelSelect.value;
            const sens = sensibilitySelect.value;

            if (!brand || !model || !sens) {
                alert('Por favor, selecciona todas las opciones.');
                return;
            }

            const config = generateSensitivity(brand, model, sens);

            // Mostrar resultado formateado
            resultDiv.textContent =
                `Marca: ${config.marca}\n` +
                `Modelo: ${config.modelo}\n` +
                `Tipo de Sensibilidad: ${config.tipoSensibilidad}\n` +
                `Valor de Sensibilidad: ${config.valorSensibilidad}\n\n` +
                `${config.descripcion}`;
        });

        // Animación de entrada de 3 segundos con texto que aparece y desaparece
        window.addEventListener('load', () => {
            setTimeout(() => {
                splashScreen.style.display = 'none';
                mainApp.style.display = 'block';
            }, 3000); // 3 segundos exactos
        });
    </script>
</body>
</html>
