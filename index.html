<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title> Liverity —Aterrador </title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f0f23 100%);
            font-family: 'Segoe UI', sans-serif;
        }
        #canvas-container {
            width: 100vw;
            height: 100vh;
            position: relative;
        }
        .overlay {
            position: absolute;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            text-align: center;
            color: white;
            z-index: 10;
            pointer-events: none;
        }
        .titulo {
            font-size: 2.2rem;
            font-weight: bold;
            text-shadow: 0 0 15px rgba(100, 200, 255, 0.7);
            margin-bottom: 8px;
        }
        .subtitulo {
            font-size: 1.1rem;
            opacity: 0.85;
        }
        .contador {
            position: absolute;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            color: #fff;
            font-size: 1.3rem;
            background: rgba(0,0,0,0.4);
            padding: 10px 25px;
            border-radius: 30px;
            border: 1px solid rgba(255,255,255,0.2);
            z-index: 10;
            transition: all 0.5s ease;
        }
        .aterrador-activo {
            color: #ff4444 !important;
            text-shadow: 0 0 12px #ff0000;
            background: rgba(60,0,0,0.5) !important;
        }
        .borde-contorno {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 260px;
            height: 290px;
            border: 3px solid rgba(100, 200, 255, 0.5);
            border-radius: 30%;
            box-shadow: 0 0 30px rgba(100, 200, 255, 0.35), inset 0 0 30px rgba(100, 200, 255, 0.15);
            pointer-events: none;
            transition: all 1.2s ease;
            z-index: 5;
        }
        .borde-aterrador {
            border-color: rgba(255, 60, 60, 0.7);
            box-shadow: 0 0 40px rgba(255, 0, 0, 0.5), inset 0 0 40px rgba(180, 0, 0, 0.25);
            animation: bordePulsante 0.7s infinite alternate;
        }
        @keyframes bordePulsante {
            from { opacity: 0.6; }
            to { opacity: 1; }
        }
        .transformacion-alerta {
            animation: alerta 0.5s ease-in-out 4;
        }
        @keyframes alerta {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.2; }
        }
    </style>
</head>
<body>

    <div id="canvas-container"></div>

    <!-- Título y contorno -->
    <div class="overlay">
        <h1 class="titulo" id="titulo">Cabeza — Liverity</h1>
        <p class="subtitulo">🔄 Arrastra para girar en 360° | Rueda para acercar/alejar</p>
    </div>

    <div class="borde-contorno" id="contorno"></div>

    <div class="contador" id="contador">
        ⏱️ Transformación en <span id="segundos">10</span> segundos...
    </div>

    <script>
        // === CONFIGURACIÓN DE TIEMPO ===
        const TIEMPO_TRANSFORMACION = 10;
        let tiempoRestante = TIEMPO_TRANSFORMACION;
        let esAterrador = false;

        // === ESCENA, CÁMARA Y RENDERIZADOR ===
        const escena = new THREE.Scene();
        const camara = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
        const renderizador = new THREE.WebGLRenderer({ antialias: true, alpha: true });

        renderizador.setSize(window.innerWidth, window.innerHeight);
        renderizador.setPixelRatio(window.devicePixelRatio);
        document.getElementById('canvas-container').appendChild(renderizador.domElement);

        // === LUCES ===
        const luzAmbiental = new THREE.AmbientLight(0xffffff, 0.6);
        escena.add(luzAmbiental);

        const luzDireccional = new THREE.DirectionalLight(0xffffff, 1);
        luzDireccional.position.set(5, 7, 5);
        escena.add(luzDireccional);

        const luzRelleno = new THREE.DirectionalLight(0x88aaff, 0.3);
        luzRelleno.position.set(-4, 3, -4);
        escena.add(luzRelleno);

        // === GRUPO DE LA CABEZA ===
        const cabezaGrupo = new THREE.Group();
        cabezaGrupo.position.y = 0.5;
        escena.add(cabezaGrupo);

        // === COLORES — VERSIÓN NORMAL ===
        const coloresNormal = {
            piel: 0xf0c8a0,
            pelo: 0x4a3020,
            ojos: 0x2255aa,
            contorno: 0x64c8ff
        };

        // === COLORES — VERSIÓN ATERRADORA ===
        const coloresAterrador = {
            piel: 0x3a2030,
            pelo: 0x1a0a10,
            ojos: 0xff2222,
            contorno: 0xff3333
        };

        // === CREACIÓN DE LA CABEZA ===
        let partes = {};

        function crearCabeza(colores) {
            // Limpiar si ya existe
            while (cabezaGrupo.children.length > 0) {
                cabezaGrupo.remove(cabezaGrupo.children[0]);
            }

            // Esfera principal (cabeza)
            const geoCabeza = new THREE.SphereGeometry(1, 32, 32);
            const matCabeza = new THREE.MeshPhongMaterial({ color: colores.piel, shininess: 25 });
            partes.cabeza = new THREE.Mesh(geoCabeza, matCabeza);
            cabezaGrupo.add(partes.cabeza);

            // Cabello
            const geoPelo = new THREE.SphereGeometry(1.03, 32, 32, 0, Math.PI * 2, 0, Math.PI / 2);
            const matPelo = new THREE.MeshPhongMaterial({ color: colores.pelo, shininess: 10, side: THREE.DoubleSide });
            partes.pelo = new THREE.Mesh(geoPelo, matPelo);
            partes.pelo.position.y = 0.35;
            cabezaGrupo.add(partes.pelo);

            // Ojos
            const geoOjo = new THREE.SphereGeometry(0.11, 16, 16);
            const matOjo = new THREE.MeshPhongMaterial({ color: colores.ojos, emissive: colores.ojos, emissiveIntensity: 0.3 });

            partes.ojoIzq = new THREE.Mesh(geoOjo, matOjo);
            partes.ojoIzq.position.set(-0.33, 0.12, 0.88);
            cabezaGrupo.add(partes.ojoIzq);

            partes.ojoDer = new THREE.Mesh(geoOjo, matOjo.clone());
            partes.ojoDer.position.set(0.33, 0.12, 0.88);
            cabezaGrupo.add(partes.ojoDer);

            // Boca / expresión
            const geoBoca = esAterrador 
                ? new THREE.TorusGeometry(0.22, 0.025, 8, 20, Math.PI)
                : new THREE.TorusGeometry(0.16, 0.022, 8, 16, Math.PI);
            const matBoca = new THREE.MeshPhongMaterial({ 
                color: esAterrador ? 0x990000 : 0xd49578,
                emissive: esAterrador ? 0x440000 : 0x000000,
                emissiveIntensity: esAterrador ? 0.4 : 0
            });
            partes.boca = new THREE.Mesh(geoBoca, matBoca);
            partes.boca.position.set(0, -0.28, 0.86);
            partes.boca.rotation.x = Math.PI;
            cabezaGrupo.add(partes.boca);
        }

        // === INICIALIZAR CABEZA NORMAL ===
        crearCabeza(coloresNormal);

        // === CÁMARA ===
        camara.position.set(0, 0.5, 3.2);
        camara.lookAt(0, 0.5, 0);

        // === CONTROLES DE ROTACIÓN ===
        let arrastrando = false;
        let ultimoX = 0, ultimoY = 0;
        let rotacionX = 0, rotacionY = 0.25;
        const sensibilidad = 0.006;

        function actualizarRotacion() {
            cabezaGrupo.rotation.y = rotacionX;
            cabezaGrupo.rotation.x = Math.max(-Math.PI / 2, Math.min(Math.PI / 2, rotacionY));
        }

        // Eventos ratón
        window.addEventListener('mousedown', e => {
            arrastrando = true;
            ultimoX = e.clientX;
            ultimoY = e.clientY;
        });
        window.addEventListener('mouseup', () => arrastrando = false);
        window.addEventListener('mousemove', e => {
            if (!arrastrando) return;
            const dx = e.clientX - ultimoX;
            const dy = e.clientY - ultimoY;
            rotacionX += dx * sensibilidad;
            rotacionY += dy * sensibilidad;
            actualizarRotacion();
            ultimoX = e.clientX;
            ultimoY = e.clientY;
        });

        // Rueda para acercar/alejar
        window.addEventListener('wheel', e => {
            camara.position.z = Math.max(2, Math.min(6, camara.position.z + e.deltaY * 0.004));
        });

        // Táctil
        window.addEventListener('touchstart', e => {
            if (e.touches.length === 1) {
                arrastrando = true;
                ultimoX = e.touches[0].clientX;
                ultimoY = e.touches[0].clientY;
            }
        });
        window.addEventListener('touchend', () => arrastrando = false);
        window.addEventListener('touchmove', e => {
            if (!arrastrando || e.touches.length !== 1) return;
            const dx = e.touches[0].clientX - ultimoX;
            const dy = e.touches[0].clientY - ultimoY;
            rotacionX += dx * sensibilidad;
            rotacionY += dy * sensibilidad;
            actualizarRotacion();
            ultimoX = e.touches[0].clientX;
            ultimoY = e.touches[0].clientY;
            e.preventDefault();
        });

        // === CONTADOR Y TRANSFORMACIÓN ===
        const elementoContador = document.getElementById('contador');
        const elementoSegundos = document.getElementById('segundos');
        const elementoTitulo = document.getElementById('titulo');
        const elementoContorno = document.getElementById('contorno');

        const intervalo = setInterval(() => {
            tiempoRestante--;
            elementoSegundos.textContent = tiempoRestante;

            if (tiempoRestante <= 4) {
                elementoContador.classList.add('transformacion-alerta');
            }

            if (tiempoRestante <= 0) {
                clearInterval(intervalo);
                activarTransformacion();
            }
        }, 1000);

        function activarTransformacion() {
            esAterrador = true;
            
            // Recrear cabeza con aspecto aterrador
            crearCabeza(coloresAterrador);

            // Cambiar UI
            elementoTitulo.textContent = "☠️ LIVERY — FORMA ATERRADORA ☠️";
            elementoContorno.classList.add('borde-aterrador');
            elementoContador.textContent = "⚠️ TRANSFORMACIÓN COMPLETA ⚠️";
            elementoContador.classList.add('aterrador-activo');
            elementoContador.classList.remove('transformacion-alerta');

            // Efecto de luces tenebrosas
            luzDireccional.intensity = 0.7;
            luzDireccional.color.setHex(0xff6644);
            luzAmbiental.intensity = 0.35;
            luzAmbiental.color.setHex(0x442233);

            // Animación de rotación automática continua
            animacionTransformacion();
        }

        function animacionTransformacion() {
            let tiempo = 0;
            function girar() {
                if (!esAterrador) return;
                tiempo += 0.016;
                cabezaGrupo.rotation.y += 0.008;
                cabezaGrupo.position.y = 0.5 + Math.sin(tiempo * 2) * 0.08;
                requestAnimationFrame(girar);
            }
            girar();
        }

        // === BUCLE DE ANIMACIÓN ===
        function animar() {
            requestAnimationFrame(animar);
            renderizador.render(escena, camara);
        }
        animar();

        // === AJUSTE DE TAMAÑO ===
        window.addEventListener('resize', () => {
            camara.aspect = window.innerWidth / window.innerHeight;
            camara.updateProjectionMatrix();
            renderizador.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
