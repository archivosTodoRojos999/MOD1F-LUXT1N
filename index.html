<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Luxtin S4nc1 - Generador de Sensibilidades para Freefire</title>
    <style>
        /* Reset y estilos básicos */
        body, html {
            margin: 0;
            padding: 0;
            height: 100%;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #121212;
            color: #eee;
        }

        .centered {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100%;
            flex-direction: column;
        }

        #splashScreen {
            background: linear-gradient(135deg, #6a11cb, #2575fc);
            height: 100%;
            width: 100%;
            position: fixed;
            z-index: 10;
            flex-direction: column;
            gap: 20px;
            font-size: 3rem;
            font-weight: bold;
            letter-spacing: 0.2em;
            color: white;
            animation: fadeIn 1.5s ease forwards;
        }

        @keyframes fadeIn {
            0% {
                opacity: 0;
                transform: translateY(30px);
            }
            100% {
                opacity: 1;
                transform: translateY(0);
            }
        }

        #mainApp {
            display: none;
            padding: 20px;
            max-width: 600px;
            margin: auto;
        }

        label {
            display: block;
            margin-top: 15px;
            font-weight: 600;
        }

        select, button {
            width: 100%;
            padding: 10px;
            margin-top: 5px;
            background-color: #222;
            border: none;
            color: white;
            border-radius: 5px;
            font-size: 1rem;
        }

        button {
            margin-top: 20px;
            background: #2575fc;
            cursor: pointer;
            font-weight: 700;
            transition: background 0.3s ease;
        }

        button:hover {
            background: #4591ff;
        }

        #result {
            margin-top: 25px;
            background: #222;
            padding: 15px;
            border-radius: 8px;
            font-family: monospace;
            white-space: pre-wrap;
        }
    </style>
</head>
<body>
    <!-- Pantalla de inicio con logo animado -->
    <div id="splashScreen" class="centered">
        <div>LUXT1N</div>
        <div>S4NC1</div>
        <small>Generador Profesional de Sensibilidades</small>
    </div>

    <!-- Pantalla principal -->
    <div id="mainApp">
        <h1>Generador de Sensibilidades para Free Fire</h1>

        <label for="deviceBrand">Selecciona la Marca:</label>
        <select id="deviceBrand" required>
            <option value="" disabled selected>Elige una marca</option>
            <option value="Samsung">Samsung</option>
            <option value="Xiaomi">Xiaomi</option>
            <option value="Apple">Apple</option>
            <option value="OnePlus">OnePlus</option>
            <option value="Huawei">Huawei</option>
            <option value="Oppo">Oppo</option>
            <option value="Realme">Realme</option>
            <option value="Vivo">Vivo</option>
            <!-- Puedes agregar más marcas -->
        </select>

        <label for="deviceModel">Selecciona el Modelo:</label>
        <select id="deviceModel" required>
            <option value="" disabled selected>Elige un modelo</option>
        </select>

        <label for="sensibility">Selecciona Sensibilidad:</label>
        <select id="sensibility" required>
            <option value="" disabled selected>Elige sensibilidad</option>
            <option value="baja">Baja (Precisión corto alcance)</option>
            <option value="alta">Alta (Precisión largo alcance)</option>
        </select>

        <button id="generateBtn">Generar Sensibilidad "Tipo Hacker"</button>

        <div id="result"></div>
    </div>

    <script>
        // Modelos por marca para ejemplo
        const modelsByBrand = {
            Samsung: ['Galaxy S21', 'Galaxy Note 20', 'Galaxy A52', 'Galaxy S10'],
            Xiaomi: ['Redmi Note 10', 'Mi 11', 'Poco X3', 'Redmi 9'],
            Apple: ['iPhone 13', 'iPhone 12', 'iPhone SE', 'iPhone 11'],
            OnePlus: ['9 Pro', 'Nord 2', '8T', '7T Pro'],
            Huawei: ['P40', 'Mate 30', 'Nova 7', 'Y9a'],
            Oppo: ['Find X3', 'Reno 5', 'A54', 'F19 Pro'],
            Realme: ['GT', '8 Pro', 'Narzo 30', 'X7 Max'],
            Vivo: ['X60', 'V21', 'Y20', 'S9']
        };

        // Elementos del DOM
        const deviceBrandSelect = document.getElementById('deviceBrand');
        const deviceModelSelect = document.getElementById('deviceModel');
        const sensibilitySelect = document.getElementById('sensibility');
        const resultDiv = document.getElementById('result');
        const generateBtn = document.getElementById('generateBtn');

        // Al seleccionar marca actualiza modelos
        deviceBrandSelect.addEventListener('change', () => {
            const brand = deviceBrandSelect.value;
            deviceModelSelect.innerHTML = '<option value="" disabled selected>Elige un modelo</option>';

            if (modelsByBrand[brand]) {
                modelsByBrand[brand].forEach(model => {
                    const option = document.createElement('option');
                    option.value = model;
                    option.textContent = model;
                    deviceModelSelect.appendChild(option);
                });
            }
        });

        // Función para simular una sensibilidad calibrada tipo hacker
        function generateSensitivity(brand, model, sensibility) {
            // Base valores para diferentes marcas y modelos
            // Estos valores son simulados y podrían ajustarse con datos reales
            const baseSensibility = {
                Samsung: 40,
                Xiaomi: 45,
                Apple: 38,
                OnePlus: 42,
                Huawei: 43,
                Oppo: 44,
                Realme: 41,
                Vivo: 40
            };

            const modelModifier = model.length % 10; // simple variación por modelo

            // Ajustes para baja y alta sensibilidad
            let sensitivityValue;
            if (sensibility === 'baja') {
                // Baja sensibilidad: más precisión en corto alcance
                sensitivityValue = baseSensibility[brand] - 5 + modelModifier * 0.5;
            } else {
                // Alta sensibilidad: mejor para alcance largo y disparos a la cabeza
                sensitivityValue = baseSensibility[brand] + 5 + modelModifier * 0.7;
            }

            // Ajuste fino para disparos a la cabeza
            const headshotMultiplier = sensibility === 'alta' ? 1.15 : 1.05;
            const finalSensitivity = (sensitivityValue * headshotMultiplier).toFixed(2);

            // Retornar configuración detallada
            return {
                marca: brand,
                modelo: model,
                sensibilidad: sensibility === 'alta'
                    ? 'Alta Precisión Largo Alcance'
                    : 'Baja Precisión Corto Alcance',
                sensibilidadValor: finalSensitivity,
                descripcion: `Sensibilidad calibrada para disparos a la cabeza 100% rojos. Optimizada para ${
                    sensibility === 'alta'
                        ? 'alcance largo y precisión máxima'
                        : 'alcance corto y precisión en espacios reducidos'
                }.`
            };
        }

        // Acción al pulsar botón de generar
        generateBtn.addEventListener('click', () => {
            const brand = deviceBrandSelect.value;
            const model = deviceModelSelect.value;
            const sens = sensibilitySelect.value;

            if (!brand || !model || !sens) {
                alert('Por favor, selecciona todas las opciones.');
                return;
            }

            const config = generateSensitivity(brand, model, sens);

            // Mostrar resultado formateado
            resultDiv.textContent =
                `Marca: ${config.marca}\n` +
                `Modelo: ${config.modelo}\n` +
                `Tipo de Sensibilidad: ${config.sensibilidad}\n` +
                `Valor de Sensibilidad: ${config.sensibilidadValor}\n\n` +
                `${config.descripcion}`;
        });

        // Animación y sonido de entrada
        window.addEventListener('load', () => {
            const splash = document.getElementById('splashScreen');

            // Sonido de entrada
            const audioCtx = new AudioContext();
            const oscillator = audioCtx.createOscillator();
            oscillator.type = 'sine';
            oscillator.frequency.setValueAtTime(440, audioCtx.currentTime);
            oscillator.connect(audioCtx.destination);
            oscillator.start();
            oscillator.stop(audioCtx.currentTime + 0.15);

            // Ocultar pantalla de inicio y mostrar app principal
            setTimeout(() => {
                splash.style.display = 'none';
                document.getElementById('mainApp').style.display = 'block';
            }, 2500);
        });
    </script>
</body>
</html>
